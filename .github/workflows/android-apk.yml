name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild -p android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spy-game-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - run: cp android/app/build/outputs/apk/release/app-release.apk spy-game.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Шпион — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Скачайте spy-game.apk на телефон и установите (Android 7.0+).
          files: spy-game.apk
